<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build AI Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center;}
        #chat-container { width: 100%; max-width: 600px; background: #1e1e1e; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #chat-box { height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 15px; border: 1px solid #333; border-radius: 8px; background: #252525;}
        .message { margin-bottom: 15px; padding: 12px; border-radius: 8px; line-height: 1.4; max-width: 80%; }
        .user { background: #0d47a1; color: white; margin-left: auto; border-bottom-right-radius: 2px;}
        .bot { background: #2e7d32; color: white; margin-right: auto; border-bottom-left-radius: 2px;}
        .error { background: #c62828; }
        #loading { display: none; font-style: italic; color: #888; text-align: center; margin-bottom: 10px;}
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #333; color: white;}
        button { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s;}
        #send-btn { background: #1976d2; color: white; }
        #send-btn:hover { background: #1565c0; }
        #clear-btn { background: #d32f2f; color: white; margin-top: 10px; width: 100%;}
        #clear-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2 style="text-align: center; margin-top: 0;">PC Build AI Assistant</h2>
        <div id="chat-box"></div>
        <div id="loading">Бот аналізує сумісність...</div>
        
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Запитай про сумісність (напр. Ryzen 5 7600 та B650)">
            <button id="send-btn">Відправити</button>
        </div>
        <button id="clear-btn">Очистити історію сесії</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
